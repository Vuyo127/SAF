<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SAF Manager Portal</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside id="side">

            <div class="brand sidebrand">
                <b>SAF</b>
                <span>Manager Portal</span>
            </div>

            <div class="res">
                MANAGING<br>
                <strong>Luhambo Residence</strong>
            </div>

            <nav>
                <a data-page="dashboard">
                    ▦ Dashboard
                </a>

                <a data-page="applications">
                    ▣ Applications
                    <i id="badge">5</i>
                </a>

                <a data-page="students">
                    ♙ Students
                </a>

                <a data-page="rooms">
                    ▤ Rooms &amp; Beds
                </a>

                <a data-page="allocations">
                    ⌂ Allocations
                </a>

                <a data-page="payments">
                    R Payments
                </a>

                <a data-page="maintenance">
                    ⚒ Maintenance
                </a>

                <a data-page="messages">
                    ✉ Messages
                </a>

                <a data-page="reports">
                    ▥ Reports
                </a>

                <a data-page="settings">
                    ⚙ Settings
                </a>
            </nav>

            <!-- Logged-in User -->
            <div class="user">
                <span class="user-initials">TM</span>

                <span class="user-details">
                    Thando Mokoena<br>
                    <small>Residence Manager</small>
                </span>

                <button id="logout" type="button">
                    ↪
                </button>
            </div>

        </aside>

        <!-- Main Content -->
        <main class="main">

            <!-- Header -->
            <header>

                <button id="menu" type="button">
                    ☰
                </button>

                <span>
                    SAF /
                    <b id="title">Dashboard</b>
                </span>

                <span>
                    🔔 &nbsp; TM
                </span>

            </header>

            <!-- Dynamic Page Content -->
            <section id="page"></section>

        </main>

    </div>

    <!-- Modal -->
    <div id="modal"></div>

    <!-- Toast Notifications -->
    <div id="toast"></div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
