<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Super Admin Console</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="stylesheet" href="Style.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>
</head>
<body class="login-page">
    <main class="auth-shell">
        <div class="auth-brand">
            <span class="auth-logo"><img src="SAF Logo.jpeg" alt="SAF Student Accommodation Finder logo"></span>
            <span>Super Admin Console</span>
        </div>

        <section class="auth-card" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Welcome back</h1>
            <form id="loginForm" novalidate>
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="username" required>

                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false">◉</button>
                </div>

                <button type="submit" id="loginSubmit">Sign in</button>
                <p class="auth-message" id="loginMessage" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="Shared.js"></script>
    <script>
        (function () {
            var form = document.getElementById('loginForm');
            var emailInput = document.getElementById('email');
            var passwordInput = document.getElementById('password');
            var passwordToggle = document.getElementById('passwordToggle');
            var submitButton = document.getElementById('loginSubmit');
            var message = document.getElementById('loginMessage');

            // Already signed in with an admin account? Skip straight to the dashboard.
            auth.onAuthStateChanged(function (user) {
                if (!user) return;
                db.collection('users').doc(user.uid).get().then(function (doc) {
                    var role = doc.exists ? doc.data().role : null;
                    if (role === 'SUPER_ADMIN' || role === 'ADMIN') {
                        window.location.replace('Dashboard.html');
                    }
                });
            });

            passwordToggle.addEventListener('click', function () {
                var showing = passwordInput.type === 'text';
                passwordInput.type = showing ? 'password' : 'text';
                passwordToggle.textContent = showing ? '◉' : '◉̸';
                passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
                passwordToggle.setAttribute('aria-pressed', String(!showing));
            });

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                var enteredEmail = emailInput.value.trim();
                var enteredPassword = passwordInput.value;

                if (!enteredEmail || !enteredPassword) {
                    message.textContent = 'Enter your email address and password.';
                    message.className = 'auth-message';
                    return;
                }

                submitButton.disabled = true;
                message.textContent = '';

                auth.signInWithEmailAndPassword(enteredEmail, enteredPassword)
                    .then(function (credential) {
                        return db.collection('users').doc(credential.user.uid).get();
                    })
                    .then(function (doc) {
                        var role = doc.exists ? doc.data().role : null;
                        if (role !== 'SUPER_ADMIN' && role !== 'ADMIN') {
                            auth.signOut();
                            message.textContent = 'This account does not have admin console access.';
                            submitButton.disabled = false;
                            return;
                        }
                        addLog('login', (doc.data().fullName || enteredEmail) + ' signed in to the Super Admin Console', role);
                        window.location.replace('Dashboard.html');
                    })
                    .catch(function (error) {
                        message.textContent = 'The email address or password is incorrect.';
                        passwordInput.select();
                        submitButton.disabled = false;
                    });
            });
        }());
    </script>
</body>
</html>
