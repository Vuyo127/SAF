<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SAF Manager Login</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth">

    <main class="auth-card">

        <!-- Brand -->
        <div class="brand">
            <b>SAF</b>
            <span>Student Accommodation Finder</span>
        </div>

        <!-- Login Heading -->
        <p class="eyebrow">
            RESIDENCE MANAGER
        </p>

        <h1>
            Welcome back
        </h1>

        <p>
            Sign in to manage your residence and student applications.
        </p>

        <!-- Login Form -->
        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="manager@saf.co.za"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Admin@123"
                required
            >

            <button
                class="primary"
                type="submit"
            >
                Sign In
            </button>

            <p
                id="msg"
                class="msg"
            ></p>

        </form>

        <!-- Registration Link -->
        <p class="center">
            Don't manage a residence yet?
            <a href="register.html">
                Register your residence
            </a>
        </p>

        <!-- Demo Credentials -->
        <div class="demo">
            <b>Demo</b>
            <br>
            manager@saf.co.za
            <br>
            Admin@123
        </div>

    </main>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
