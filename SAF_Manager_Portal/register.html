<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SAF Register Residence</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth">

    <main class="auth-card wide">

        <!-- Brand -->
        <div class="brand">
            <b>SAF</b>
            <span>Student Accommodation Finder</span>
        </div>

        <!-- Page Heading -->
        <p class="eyebrow">
            NEW RESIDENCE
        </p>

        <h1>
            Register your residence
        </h1>

        <p>
            Submit your residence and manager details for Super Admin approval.
        </p>

        <!-- Registration Form -->
        <form id="registerForm">

            <!-- Manager Details -->
            <h3>
                Manager details
            </h3>

            <div class="grid2">

                <div>
                    <label for="fullName">
                        Full name
                    </label>

                    <input
                        id="fullName"
                        required
                        placeholder="Thando Mokoena"
                    >
                </div>

                <div>
                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        required
                        placeholder="thando@email.com"
                    >
                </div>

                <div>
                    <label for="phone">
                        Phone
                    </label>

                    <input
                        id="phone"
                        required
                        placeholder="071 000 0000"
                    >
                </div>

                <div>
                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        required
                    >
                </div>

            </div>

            <!-- Residence Details -->
            <h3>
                Residence details
            </h3>

            <div class="grid2">

                <div>
                    <label for="residenceName">
                        Residence name
                    </label>

                    <input
                        id="residenceName"
                        required
                        placeholder="Luhambo Residence"
                    >
                </div>

                <div>
                    <label for="location">
                        Location
                    </label>

                    <input
                        id="location"
                        required
                        placeholder="Main Campus"
                    >
                </div>

                <div>
                    <label for="totalRooms">
                        Total rooms
                    </label>

                    <input
                        id="totalRooms"
                        type="number"
                        required
                    >
                </div>

                <div>
                    <label for="totalBeds">
                        Total beds
                    </label>

                    <input
                        id="totalBeds"
                        type="number"
                        required
                    >
                </div>

            </div>

            <!-- Address -->
            <label for="address">
                Address
            </label>

            <input
                id="address"
                required
                placeholder="Street, suburb, city"
            >

            <!-- Supporting Documents -->
            <label for="documents">
                Supporting documents
            </label>

            <input
                id="documents"
                type="file"
                multiple
            >

            <!-- Submit -->
            <button
                class="primary"
                type="submit"
            >
                Submit for Super Admin Approval
            </button>

            <!-- Registration Message -->
            <p
                id="registerMsg"
                class="msg"
            ></p>

        </form>

        <!-- Login Link -->
        <p class="center">
            Already registered?
            <a href="login.html">
                Sign in
            </a>
        </p>

    </main>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
